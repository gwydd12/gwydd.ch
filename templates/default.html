<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        $if(author)$<meta name="author" content="$author$">$endif$
        $if(keywords)$<meta name="keywords" content="$keywords$">$endif$
        $if(description)$<meta name="description" content="$description$">$endif$
        $if(type)$
            <meta property="og:type" content="$type$">
        $else$
            <meta property="og:type" content="website">
        $endif$
        $if(date)$<meta name="date" content="$date$">$endif$
        <title>Gwydd's Blog - $title$</title>
        <link rel="stylesheet" href="/css/pygments.css"/>
        <link rel="stylesheet" href="/css/color.css"/>
        <link rel="stylesheet" href="/css/default.css" />
        <link rel="stylesheet" href="/css/eb-garamond.css" />
        <link rel="stylesheet" href="/css/discipuli-britannica.css" />
        <link rel="stylesheet" href="/css/jetbrains-mono.css"/>
        <link rel="stylesheet" href="/css/sidenotes.css" />
        <link rel="stylesheet" href="/css/nav.css" />
        <script type="text/javascript"
        src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
    </head>
    <body>
        <div class="navbar-space">
          <div id="navigation">
            <ul>
              <li><a href="/articles.html">Articles</a></li>
              <li><a href="/notes.html">Notes</a></li>
              <li><a href="/about.html">About</a></li>
            </ul>
          </div>
        </div>
        <main role="main">
            <h1>$title$</h1>
            $body$
        </main>
        <footer>
            <div id="footer">
                <a id="to-top" href="#">Back to the top</a>
                &nbsp;|&nbsp;
                <a href="/atom.xml" style="font-variant:small-caps">RSS</a>
                &nbsp;|&nbsp;
                <a href="https://github.com/gwydd12/gwydd12.github.io">Website source</a>
                &nbsp;|&nbsp;
                <a href="/about.html">Contact</a>
            </div>
        </footer>
    </body>
</html>
